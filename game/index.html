<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Courier — Terbang di atas Lembah Biru</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="game" aria-label="Skyline Courier: terbang melewati ring dan mendarat di runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div id="hud" data-screen="title">
  <div class="hud-top-left panel">
    <div class="hud-row"><span class="hud-label">ALT</span><span id="hud-altitude" class="hud-value">0 m</span></div>
    <div class="hud-row"><span class="hud-label">SPD</span><span id="hud-speed" class="hud-value">0 km/h</span></div>
    <div class="hud-row"><span class="hud-label">HDG</span><span id="hud-heading" class="hud-value">000°</span></div>
    <div class="hud-row"><span class="hud-label">SKOR</span><span id="hud-score" class="hud-value">SKOR 0</span></div>
  </div>
  <div class="hud-top-right panel">
    <div class="hud-row"><span class="hud-label">THR</span><div class="bar"><div id="hud-throttle-fill" class="fill throttle"></div></div><span id="hud-throttle-value" class="hud-value small">0%</span></div>
    <div class="hud-row"><span class="hud-label">FUEL</span><div class="bar"><div id="hud-fuel-fill" class="fill fuel"></div></div><span id="hud-fuel-value" class="hud-value small">100%</span></div>
    <div class="hud-row"><span class="hud-label">DMG</span><div class="bar"><div id="hud-damage-fill" class="fill damage"></div></div></div>
    <canvas id="hud-horizon" width="92" height="92" aria-label="Artificial horizon"></canvas>
  </div>
  <div id="hud-compass" class="hud-compass"></div>
  <div id="hud-objective" class="hud-objective"></div>
  <div id="hud-message" class="hud-message"></div>
  <div class="hud-controls">W/S throttle · Panah pitch &amp; roll · A/D rudder · Mouse drag belok · R ulang · P jeda · M suara</div>
</div>

<div id="overlay">
  <h1 id="overlay-title">SKYLINE COURIER</h1>
  <p id="overlay-body"></p>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
